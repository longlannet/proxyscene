# Include inside the dl.ll.cd HTTPS server. Inherit its document root.
location = /proxyscene {
    return 404;
}

location = /proxyscene/latest.json {
    default_type application/json;
    gzip off;
    disable_symlinks on;
    add_header Cache-Control "no-store, no-cache, must-revalidate, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
    try_files $uri @proxyscene_not_found;
}

location ~ ^/proxyscene/v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/(?:install\.sh|checksums\.txt|proxyscene(?:_bundle)?_linux_(?:amd64|arm64|386|armv7)\.tar\.gz|xray_source_v[0-9]+(?:\.[0-9]+)+\.tar\.gz)$ {
    default_type application/octet-stream;
    gzip off;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
    try_files $uri @proxyscene_not_found;
}

location ~ ^/proxyscene/ {
    autoindex off;
    gzip off;
    add_header Cache-Control "no-store" always;
    return 404;
}

location @proxyscene_not_found {
    default_type text/plain;
    gzip off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
}
