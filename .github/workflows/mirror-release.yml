name: Mirror release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror published release
    uses: ./.github/workflows/mirror-publish.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
      MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
    permissions:
      contents: read
