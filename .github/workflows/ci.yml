name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: |
          test -z "$(find . -name '*.go' -print0 | xargs -0 gofmt -l)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Shell syntax
        run: |
          for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck jq python3
          fi
          shellcheck install.sh scripts/*.sh
      - name: Installer pure-function tests
        run: sudo -- bash scripts/install-test.sh
      - name: Documented bootstrap failure-path tests
        run: sudo -- bash scripts/bootstrap-test.sh
      - name: Mirror publication tests
        run: python3 -B -m unittest discover -s scripts -p '*mirror*test.py' -v
      - name: Hermes installation permission tests
        run: sudo -- "$(command -v go)" test ./internal/manager -run '^TestHermes(System|Project|UserProject)' -count=1
      - name: Privileged transaction safety tests
        run: sudo -- "$(command -v go)" test -race ./internal/manager -run '^Test(Core|Runtime|TelegramPlan|TelegramApply|TelegramCompensation|LegacyTelegramRelease|ModernTelegramExplicitRelease|HermesApplyCannotResumePendingRelease|OpenClawApplyCannotResumePendingRelease|ExistingInstall|NodeCommitWithoutScenes)' -count=1
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -no-color .github/workflows/*.yml

  build-dry-run:
    name: Release build (dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils jq python3 unzip
      - name: Build amd64 bundle (dry run)
        # 独立构建两次 amd64，端到端验证固定 Xray SHA256、可复现打包与 checksums。
        env:
          VERSION: 0.0.0-dryrun
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          first="$(mktemp -d "${RUNNER_TEMP}/proxyscene-ci-first.XXXXXX")"
          second="$(mktemp -d "${RUNNER_TEMP}/proxyscene-ci-second.XXXXXX")"
          cleanup() {
            rm -rf -- "$first" "$second"
          }
          trap cleanup EXIT
          DIST="$first" scripts/build-bundle.sh amd64
          DIST="$second" scripts/build-bundle.sh amd64
          diff -qr -- "$first" "$second"
          mv -- "$first" dist
          rm -rf -- "$second"
          trap - EXIT
      - name: Verify artifacts
        env:
          VERSION: 0.0.0-dryrun
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/verify-release-artifacts.sh amd64
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar xzf dist/proxyscene_bundle_linux_amd64.tar.gz -C "$verify_dir"
          PROXYSCENE_TEST_XRAY="$verify_dir/proxyscene_bundle_linux_amd64/xray" \
            go test ./internal/manager -run '^TestGeneratedTransportConfigsPassPinnedXray$'
          echo "dry-run 产物校验通过"
