name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proxyscene-release-publication
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require configured mirror before release
        shell: bash
        env:
          MIRROR_CONFIGURED: ${{ vars.PROXYSCENE_RELEASE_MIRROR_CONFIGURED }}
        run: |
          set -euo pipefail
          if [[ "${MIRROR_CONFIGURED:-}" != true ]]; then
            echo "正式发布必须包含 GitHub 和 dl.ll.cd；请先完成镜像配置并设置 PROXYSCENE_RELEASE_MIRROR_CONFIGURED=true" >&2
            exit 1
          fi
      - name: Checkout selected main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and require current main source
        id: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          stable_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow 必须从 main 分支启动，实际为 $GITHUB_REF" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ $stable_tag_re ]]; then
            echo "版本必须是无前导零的稳定版本 vMAJOR.MINOR.PATCH：$VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [[ "$commit" != "$head_commit" ]]; then
            echo "checkout 不匹配 workflow event commit：event=$commit checkout=$head_commit" >&2
            exit 1
          fi
          if [[ "$commit" != "$main_commit" ]]; then
            echo "启动时选定提交必须仍是 main HEAD：event=$commit checkout=$head_commit main=$main_commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Prepare reviewed release notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          [[ -f "$notes" && ! -L "$notes" && -s "$notes" ]]
          [[ "$(head -n 1 "$notes")" == "# proxyscene ${VERSION}" ]]
          cp -- "$notes" "$RUNNER_TEMP/release-notes.md"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils jq python3 shellcheck unzip
      - name: Verify module cache
        run: go mod verify
      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t go_files < <(git ls-files -z '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "以下 Go 文件未格式化：" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Shell validation
        run: |
          for script in install.sh scripts/*.sh; do bash -n "$script"; done
          shellcheck install.sh scripts/*.sh
          sudo -- bash scripts/install-test.sh
          sudo -- bash scripts/bootstrap-test.sh
      - name: Mirror bootstrap regression tests
        run: sudo -- python3 -I -B scripts/bootstrap-install-test.py
      - name: Mirror publication tests
        run: python3 -B -m unittest discover -s scripts -p '*mirror*test.py' -v
      - name: Hermes installation permission tests
        run: sudo -- "$(command -v go)" test ./internal/manager -run '^TestHermes(System|Project|UserProject)' -count=1
      - name: Privileged transaction safety tests
        run: sudo -- "$(command -v go)" test -race ./internal/manager -run '^Test(Core|Runtime|TelegramPlan|TelegramApply|TelegramCompensation|LegacyTelegramRelease|ModernTelegramExplicitRelease|HermesApplyCannotResumePendingRelease|OpenClawApplyCannotResumePendingRelease|ExistingInstall|NodeCommitWithoutScenes|DevConfigMetadata)' -count=1
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -no-color .github/workflows/*.yml
      - name: Require clean source before build
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$SOURCE_COMMIT" ]]; then
            echo "构建前 HEAD 不匹配选定 main commit：期望 $SOURCE_COMMIT，实际 $head" >&2
            exit 1
          fi
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "构建前工作树不干净：" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi
      - name: Build artifacts twice
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          first="$(mktemp -d "${RUNNER_TEMP}/proxyscene-release-first.XXXXXX")"
          second="$(mktemp -d "${RUNNER_TEMP}/proxyscene-release-second.XXXXXX")"
          cleanup() {
            rm -rf -- "$first" "$second"
          }
          trap cleanup EXIT
          DIST="$first" scripts/build-bundle.sh
          DIST="$second" scripts/build-bundle.sh
          diff -qr -- "$first" "$second"
          mv -- "$first" dist
          rm -rf -- "$second"
          trap - EXIT
          echo "两次独立四架构构建逐字节一致"
      - name: Verify release set
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          scripts/verify-release-artifacts.sh
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar xzf dist/proxyscene_bundle_linux_amd64.tar.gz -C "$verify_dir"
          PROXYSCENE_TEST_XRAY="$verify_dir/proxyscene_bundle_linux_amd64/xray" \
            go test -race ./internal/manager -count=1
          sudo -- env PROXYSCENE_TEST_XRAY="$verify_dir/proxyscene_bundle_linux_amd64/xray" \
            "$(command -v go)" test -race ./internal/manager \
            -run '^TestNodeProbeProductionTrustAndDroppedIdentity$' -count=1
      - name: Disposable systemd and mirror install and baseline upgrade canaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          canary_dir="$(mktemp -d "${RUNNER_TEMP}/proxyscene-systemd-canary.XXXXXX")"
          evidence_dir="${RUNNER_TEMP}/proxyscene-systemd-canary-evidence"
          install -d -m 0700 "$evidence_dir"
          cleanup() {
            rm -rf -- "$canary_dir"
          }
          trap cleanup EXIT
          versions=(v0.7.1 v0.8.0 v0.9.2 v0.11.0)
          digests=(
            08a12e5716166c76095c54f6ea8227db8f623a719051479ceb7d6720c5c0da38
            6f650d09dcb67d1f745b2e381e6358b2821253edea8b365415f9922e0bbe171a
            0464e87cb15fbcfd6f967202d805f2d699952a5c12053b9392d1025d34368cdc
            2301d6fad5db8bf33d10de1ad8aead70e790b8b32cacab94643c0bcb4389a195
          )
          for i in "${!versions[@]}"; do
            old_bundle="$canary_dir/proxyscene_bundle_linux_amd64-${versions[$i]}.tar.gz"
            curl -q -fsSL --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 300 --retry 3 --retry-delay 2 \
              --max-filesize 104857600 -o "$old_bundle" \
              "https://github.com/longlannet/proxyscene/releases/download/${versions[$i]}/proxyscene_bundle_linux_amd64.tar.gz"
            printf '%s  %s\n' "${digests[$i]}" "$old_bundle" | sha256sum -c -
            canary_status=0
            PROXYSCENE_CONTAINER_TEST=1 bash scripts/systemd-integration-test.sh \
              dist/proxyscene_bundle_linux_amd64.tar.gz "$old_bundle" 2>&1 \
              | tee "$evidence_dir/${versions[$i]}.log" || canary_status=$?
            printf '{"exit_code":%d}\n' "$canary_status" > "$evidence_dir/${versions[$i]}.json"
            if (( canary_status != 0 )); then exit "$canary_status"; fi
            if [[ "${versions[$i]}" == v0.11.0 ]]; then
              mirror_status=0
              PROXYSCENE_MIRROR_CONTAINER_TEST=1 python3 -I -B scripts/mirror-candidate-integration-test.py \
                --candidate-dir dist --candidate-tag "$VERSION" --candidate-commit "$COMMIT" \
                --baseline-bundle "$old_bundle" \
                --evidence "${RUNNER_TEMP}/proxyscene-mirror-candidate-evidence" || mirror_status=$?
              printf '{"exit_code":%d}\n' "$mirror_status" > "$evidence_dir/mirror.json"
              if (( mirror_status != 0 )); then exit "$mirror_status"; fi
            fi
          done
      - name: Prepare minimal release canary summary
        if: always()
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          temporary = Path(os.environ["RUNNER_TEMP"])
          systemd = temporary / "proxyscene-systemd-canary-evidence"
          mirror = temporary / "proxyscene-mirror-candidate-evidence"

          def record(path):
              try:
                  value = json.loads(path.read_text())
                  return value if isinstance(value, dict) else {}
              except (OSError, ValueError):
                  return {}

          def exit_code(value):
              return value if type(value) is int and 0 <= value <= 255 else None

          def public_value(name, pattern):
              value = os.environ.get(name, "")
              return value if re.fullmatch(pattern, value) else None

          summary = {
              "candidate_tag": public_value("CANDIDATE_VERSION", r"v[0-9]+\.[0-9]+\.[0-9]+"),
              "candidate_commit": public_value("CANDIDATE_COMMIT", r"[0-9a-f]{40}"),
              "checks": [],
          }
          for tag in ("v0.7.1", "v0.8.0", "v0.9.2", "v0.11.0"):
              code = exit_code(record(systemd / (tag + ".json")).get("exit_code"))
              summary["checks"].append({"name": "systemd-baseline-" + tag,
                  "executed": code is not None, "passed": code == 0, "exit_code": code})
          result = record(mirror / "result.json")
          code = exit_code(record(systemd / "mirror.json").get("exit_code"))
          summary["checks"].append({"name": "mirror-candidate",
              "executed": code is not None, "passed": code == 0 and result.get("passed") is True,
              "exit_code": code, "inventory_restored": result.get("inventory_restored") is True})
          for scenario in ("fresh", "upgrade"):
              result = record(mirror / scenario / "result.json")
              summary["checks"].append({"name": "mirror-" + scenario,
                  "executed": bool(result), "passed": result.get("passed") is True,
                  "container_removed": result.get("container_absent") is True})
          # Construct every field above; never copy raw logs, paths, URLs,
          # process details, or arbitrary strings into the published summary.
          (temporary / "proxyscene-release-canary-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n")
          PY
      - name: Retain minimal release canary summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-canary-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proxyscene-release-canary-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require clean source after build
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$SOURCE_COMMIT" ]]; then
            echo "构建后 HEAD 不匹配选定 main commit：期望 $SOURCE_COMMIT，实际 $head" >&2
            exit 1
          fi
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "构建后工作树不干净：" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi
      - name: Upload release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-set
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload reviewed release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - name: Download release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-set
          path: dist
      - name: Download reviewed release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release-metadata
      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          stable_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$GITHUB_REF" == "refs/heads/main" && "$VERSION" =~ $stable_tag_re ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          ( cd dist && sha256sum -c checksums.txt )

          api_status() {
            curl -q -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"
          }

          main_commit="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$main_commit" == "$EXPECTED_COMMIT" ]] || {
            echo "构建后 main 已移动；请重新发起发布" >&2
            exit 1
          }
          [[ "$(api_status "git/ref/tags/$VERSION")" == "404" ]] || {
            echo "目标 tag 已存在或无法确认不存在：$VERSION" >&2
            exit 1
          }
          [[ "$(api_status "releases/tags/$VERSION")" == "404" ]] || {
            echo "目标 Release 已存在或无法确认不存在：$VERSION" >&2
            exit 1
          }

          gh release create "$VERSION" dist/* \
            --target "$EXPECTED_COMMIT" \
            --title "$VERSION" \
            --notes-file release-metadata/release-notes.md \
            --draft
          gh release edit "$VERSION" --draft=false --latest

  mirror:
    name: Mirror verified release
    needs: verify
    uses: ./.github/workflows/mirror-publish.yml
    with:
      tag: ${{ inputs.version }}
    secrets:
      MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
      MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
    permissions:
      contents: read

  verify:
    name: Verify published release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: read
    steps:
      - name: Download local release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-set
          path: dist
      - name: Download reviewed release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release-metadata
      - name: Verify immutable Latest and downloaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$VERSION" > "$verify_dir/tag-ref.json"
          jq -e --arg commit "$EXPECTED_COMMIT" '
            .object.type == "commit" and .object.sha == $commit
          ' "$verify_dir/tag-ref.json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$VERSION" > "$verify_dir/release.json"
          jq -e --arg version "$VERSION" '
            .tag_name == $version and
            .immutable == true and
            .draft == false and
            .prerelease == false
          ' "$verify_dir/release.json" >/dev/null
          jq -e --rawfile notes release-metadata/release-notes.md '
            def normalized: gsub("\r\n"; "\n") | sub("\n+$"; "");
            (.body | normalized) == ($notes | normalized)
          ' "$verify_dir/release.json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "$verify_dir/latest.json"
          jq -e --arg version "$VERSION" '
            .tag_name == $version and .immutable == true and
            .draft == false and .prerelease == false
          ' "$verify_dir/latest.json" >/dev/null

          : > "$verify_dir/local-assets.tsv"
          for file in dist/*; do
            test -f "$file"
            printf '%s\tsha256:%s\n' \
              "$(basename "$file")" "$(sha256sum "$file" | awk '{print $1}')" \
              >> "$verify_dir/local-assets.tsv"
          done
          LC_ALL=C sort -o "$verify_dir/local-assets.tsv" "$verify_dir/local-assets.tsv"
          jq -er '.assets[] | [.name, .digest] | @tsv' "$verify_dir/release.json" \
            | LC_ALL=C sort > "$verify_dir/remote-assets.tsv"
          diff -u "$verify_dir/local-assets.tsv" "$verify_dir/remote-assets.tsv"

          mkdir "$verify_dir/downloaded"
          gh release download "$VERSION" --dir "$verify_dir/downloaded"
          local_names="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          downloaded_names="$(find "$verify_dir/downloaded" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$downloaded_names" == "$local_names" ]]
          while IFS= read -r name; do
            cmp -- "dist/$name" "$verify_dir/downloaded/$name"
          done <<< "$local_names"
          ( cd "$verify_dir/downloaded" && sha256sum -c checksums.txt )
